name: Publicar Doodle

# Solo publica la web en GitHub Pages. La descarga de Aules la hace la propia web desde tu navegador
# (Aules no acepta conexiones desde los servidores de GitHub) y sube aquí data/curso.enc cifrado.
on:
  push:
    branches: [main]
    paths-ignore: ['data/progreso.enc'] # el progreso se lee con la API de GitHub; no hace falta republicar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
