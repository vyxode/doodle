name: Publicar Doodle

# Solo publica la web en GitHub Pages. La descarga de Aules la hace la propia web desde tu navegador
# (Aules no acepta conexiones desde los servidores de GitHub) y sube aquí data/curso.enc cifrado.
on:
  push:
    branches: [main]
    paths-ignore: ['data/progreso.enc', 'data/lectores.enc', 'data/copias/**'] # se leen con la API de GitHub; no hace falta republicar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # GitHub Pages cachea 10 min: cada publicación pide sus propios .js y .css para no mezclar versiones
      - name: Versionar recursos
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$V'#g" js/*.js
          sed -i -E "s#(src=\"js/[a-z]+\.js)\"#\1?v=$V\"#g; s#(href=\"css/[a-z]+\.css)\"#\1?v=$V\"#g" index.html
          # la página de los resúmenes, igual: sus scripts y los de la web que usa
          sed -i -E "s#(src=\"(\.\./js/)?[a-z]+\.js)\"#\1?v=$V\"#g; s#(href=\"\.\./css/[a-z]+\.css)\"#\1?v=$V\"#g" repaso/index.html
          sed -i "s/doodle-v1/doodle-$V/" sw.js
          grep -c "?v=$V" index.html js/app.js repaso/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
